# ----------------------------------------------------- 
# Key bindings
# name: "DKJBindings"
# ----------------------------------------------------- 

# SUPER KEY
$mainMod = SUPER
$HYPRSCRIPTS = ~/.config/hypr/scripts
$SCRIPTS = ~/.config/ml4w/scripts

# Applications
bind = $mainMod, RETURN, exec, ~/.config/ml4w/settings/terminal.sh # Open the terminal
bind = $mainMod, B, exec, ~/.config/ml4w/settings/browser.sh # Open the browser
bind = $mainMod SHIFT, B, exec, brave --incognito # Open the browser (incognito)
bind = $mainMod, V, exec, ~/.config/ml4w/settings/filemanager.sh # Open the filemanager
bind = $mainMod CTRL, E, exec, ~/.config/ml4w/settings/emojipicker.sh # Open the emoji picker
bind = $mainMod CTRL, C, exec, ~/.config/ml4w/settings/calculator.sh # Open the calculator
bind = $mainMod, Y, exec, kitty -e yazi # Open Yazi

# Display
bind = $mainMod SHIFT, mouse_down, exec, hyprctl keyword cursor:zoom_factor $(awk "BEGIN {print $(hyprctl getoption cursor:zoom_factor | grep 'float:' | awk '{print $2}') + 0.5}") # Increase display zoom
bind = $mainMod SHIFT, mouse_up, exec, hyprctl keyword cursor:zoom_factor $(awk "BEGIN {print $(hyprctl getoption cursor:zoom_factor | grep 'float:' | awk '{print $2}') - 0.5}") # Decrease display zoom
bind = $mainMod SHIFT, Z, exec, hyprctl keyword cursor:zoom_factor 1 # Reset display zoom

# Windows
bind = $mainMod, Q, killactive # Kill active window
bind = $mainMod, M, fullscreen, 1 # Maximize window
bind = $mainMod, F, fullscreen # Set active window to fullscreen
bind = $mainMod CTRL, SPACE, togglefloating # Toggle active windows into floating mode
bind = $mainMod ALT, SPACE, exec, $HYPRSCRIPTS/toggleallfloat.sh # Toggle all windows into floating mode
bind = $mainMod, S, togglesplit # Toggle split
bind = ALT, h, movefocus, l # Move focus left
bind = ALT, l, movefocus, r # Move focus right
bind = ALT, j, movefocus, d # Move focus down
bind = ALT, k, movefocus, u # Move focus up
bind = $mainMod, slash, movecursortocorner, 1 # Moves cursor to bottom-right corner
bind = $mainMod, J, cyclenext
bind = $mainMod, J, alterzorder, top
bind = ALT, Tab, cyclenext, top
bind = ALT, Tab, alterzorder, top
bind = $mainMod, K, cyclenext, prev 
bind = $mainMod, K, alterzorder, top
bind = $mainMod CTRL, RETURN, layoutmsg, swapwithmaster # Swaps current window with master
bind = $mainMod SHIFT, J, swapnext # swap window with the next
bind = $mainMod SHIFT, K, swapnext, prev # swap window with the next
# bind = $mainMod, K, swapsplit # Swapsplit
bind = $mainMod, O, movewindow, mon:+1 # Move window to next monitor
bind = $mainMod CTRL, J, focusmonitor, +1 # Focus monitor on next monitor
bindm = $mainMod, mouse:272, movewindow # Move window with the mouse
bindm = $mainMod, mouse:273, resizewindow # Resize window with the mouse
bind = $mainMod, L, resizeactive, 150 0 # Increase window width with keyboard
bind = $mainMod, H, resizeactive, -150 0 # Reduce window width with keyboard
bind = $mainMod, D, resizeactive, 0 150 # Increase window height with keyboard
bind = $mainMod, U, resizeactive, 0 -150 # Reduce window height with keyboard
bind = $mainMod, W, togglegroup # Toggle window group
bind = $mainMod, comma, moveintogroup,l # Move window into group (left)
bind = $mainMod, comma, moveintogroup,r # Move window into group (right)
bind = $mainMod, comma, moveintogroup,u # Move window into group (up)
bind = $mainMod, comma, moveintogroup,d # Move window into group (down)
bind = ALT, N, changegroupactive,f # Cycle group windows forward
bind = $mainMod ALT, N, changegroupactive,b # Cycle group windows backward
bind = $mainMod, period, moveoutofgroup # Toggle window group binde = ALT,Tab,cyclenext
bind = $mainMod, I, lockactivegroup,toggle # Toggle group locking
# binde = ALT,Tab,bringactivetotop # Cycle between windows

# Actions
bind = $mainMod SHIFT, A, exec, $HYPRSCRIPTS/toggle-animations.sh # Toggle animations
bind = $mainMod, PRINT, exec, $HYPRSCRIPTS/screenshot.sh # Take a screenshot
bind = $mainMod SHIFT, PRINT, exec, $HYPRSCRIPTS/screenshot.sh --instant-area
bind = CTRL_ALT, Delete, exec, ~/.config/ml4w/scripts/wlogout.sh # Start wlogout
bind = $mainMod SHIFT, W, exec, waypaper --random # Change the wallpaper
bind = $mainMod CTRL, W, exec, waypaper # Open wallpaper selector
# bind = $mainMod ALT, W, exec, $HYPRSCRIPTS/wallpaper-automation.sh # Start random wallpaper script
bind = $mainMod, R, exec, rofi -show drun -replace -i # Open application launcher
bind = $mainMod CTRL, K, exec, $HYPRSCRIPTS/keybindings.sh # Show keybindings
bind = $mainMod ALT, B, exec, ~/.config/waybar/launch.sh # Reload waybar
bind = $mainMod CTRL, B, exec, ~/.config/waybar/toggle.sh # Toggle waybar
bind = $mainMod SHIFT, R, exec, $HYPRSCRIPTS/loadconfig.sh # Reload hyprland config
# bind = $mainMod, V, exec, $SCRIPTS/cliphist.sh # Open clipboard manager
bind = $mainMod CTRL, T, exec, ~/.config/waybar/themeswitcher.sh # Open waybar theme switcher
bind = $mainMod SHIFT, S, exec, flatpak run com.ml4w.sidebar # Open ML4W Dotfiles Sidebar app
# bind = $mainMod SHIFT, H, exec, $HYPRSCRIPTS/hyprshade.sh # Toggle screenshader
bind = $mainMod SHIFT, H, layoutmsg, addmaster # Add a master node
bind = $mainMod SHIFT, L, layoutmsg, removemaster # Remove a master node
# bind = $mainMod ALT, G, exec, $HYPRSCRIPTS/gamemode.sh # Toggle game mode

# Sidepad
bind = $mainMod CTRL, right, exec, ~/.config/ml4w/scripts/sidepad.sh                      # Open Sidepad
bind = $mainMod CTRL, left, exec, ~/.config/ml4w/scripts/sidepad.sh --hide                # Close Sidepad
# bind = $mainMod, S, exec, ~/.config/ml4w/scripts/sidepad.sh --init                        # Init Sidepad
bind = $mainMod CTRL, S, exec, ~/.config/ml4w/scripts/sidepad.sh --select                # Select Sidepad

# Workspaces
bind = $mainMod, 1, workspace, 1 # Open workspace 1
bind = $mainMod, 2, workspace, 2 # Open workspace 2
bind = $mainMod, 3, workspace, 3 # Open workspace 3
bind = $mainMod, 4, workspace, 4 # Open workspace 4
bind = $mainMod, 5, workspace, 5 # Open workspace 5
bind = $mainMod, 6, workspace, 6 # Open workspace 6
bind = $mainMod, 7, workspace, 7 # Open workspace 7
bind = $mainMod, 8, workspace, 8 # Open workspace 8
bind = $mainMod, 9, workspace, 9 # Open workspace 9
bind = $mainMod, 0, workspace, 10 # Open workspace 10
bind = $mainMod, F1, workspace, 11 # Open workspace 11
bind = $mainMod, F2, workspace, 12 # Open workspace 12
bind = $mainMod, F3, workspace, 13 # Open workspace 13
bind = $mainMod, F4, workspace, 14 # Open workspace 14
bind = $mainMod, F5, workspace, 15 # Open workspace 15
bind = $mainMod, F6, workspace, 16 # Open workspace 16
bind = $mainMod, F7, workspace, 17 # Open workspace 17
bind = $mainMod, F8, workspace, 18 # Open workspace 18
bind = $mainMod, F9, workspace, 19 # Open workspace 19
bind = $mainMod CTRL, n, togglespecialworkspace # Toggle Special Workspace

bind = $mainMod SHIFT, 1, movetoworkspacesilent, 1 # Move active window to workspace 1
bind = $mainMod SHIFT, 2, movetoworkspacesilent, 2 # Move active window to workspace 2
bind = $mainMod SHIFT, 3, movetoworkspacesilent, 3 # Move active window to workspace 3
bind = $mainMod SHIFT, 4, movetoworkspacesilent, 4 # Move active window to workspace 4
bind = $mainMod SHIFT, 5, movetoworkspacesilent, 5 # Move active window to workspace 5
bind = $mainMod SHIFT, 6, movetoworkspacesilent, 6 # Move active window to workspace 6
bind = $mainMod SHIFT, 7, movetoworkspacesilent, 7 # Move active window to workspace 7
bind = $mainMod SHIFT, 8, movetoworkspacesilent, 8 # Move active window to workspace 8
bind = $mainMod SHIFT, 9, movetoworkspacesilent, 9 # Move active window to workspace 9
bind = $mainMod SHIFT, 0, movetoworkspacesilent, 10 # Move active window to workspace 10
bind = $mainMod SHIFT, F1, movetoworkspacesilent, 11 # Move active window to workspace 11
bind = $mainMod SHIFT, F2, movetoworkspacesilent, 12 # Move active window to workspace 12
bind = $mainMod SHIFT, F3, movetoworkspacesilent, 13 # Move active window to workspace 13
bind = $mainMod SHIFT, F4, movetoworkspacesilent, 14 # Move active window to workspace 14
bind = $mainMod SHIFT, F5, movetoworkspacesilent, 15 # Move active window to workspace 15
bind = $mainMod SHIFT, F6, movetoworkspacesilent, 16 # Move active window to workspace 16
bind = $mainMod SHIFT, F7, movetoworkspacesilent, 17 # Move active window to workspace 17
bind = $mainMod SHIFT, F9, movetoworkspacesilent, 19 # Move active window to workspace 19

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod CTRL, 1, movetoworkspace, 1 # Move active window to and move to workspace 1
bind = $mainMod CTRL, 2, movetoworkspace, 2 # Move active window to and move to workspace 2
bind = $mainMod CTRL, 3, movetoworkspace, 3 # Move active window to and move to workspace 3
bind = $mainMod CTRL, 4, movetoworkspace, 4 # Move active window to and move to workspace 4
bind = $mainMod CTRL, 5, movetoworkspace, 5 # Move active window to and move to workspace 5
bind = $mainMod CTRL, 6, movetoworkspace, 6 # Move active window to and move to workspace 6
bind = $mainMod CTRL, 7, movetoworkspace, 7 # Move active window to and move to workspace 7
bind = $mainMod CTRL, 8, movetoworkspace, 8 # Move active window to and move to workspace 8
bind = $mainMod CTRL, 9, movetoworkspace, 9 # Move active window to and move to workspace 9
bind = $mainMod CTRL, 0, movetoworkspace, 10 # Move active window to and move to workspace 10
bind = $mainMod CTRL, F1, movetoworkspace, 11 # Move active window to and move to workspace 11
bind = $mainMod CTRL, F2, movetoworkspace, 12 # Move active window to and move to workspace 12
bind = $mainMod CTRL, F3, movetoworkspace, 13 # Move active window to and move to workspace 13
bind = $mainMod CTRL, F4, movetoworkspace, 14 # Move active window to and move to workspace 14
bind = $mainMod CTRL, F5, movetoworkspace, 15 # Move active window to and move to workspace 15
bind = $mainMod CTRL, F6, movetoworkspace, 16 # Move active window to and move to workspace 16
bind = $mainMod CTRL, F7, movetoworkspace, 17 # Move active window to and move to workspace 17
bind = $mainMod CTRL, F8, movetoworkspace, 18 # Move active window to and move to workspace 18
bind = $mainMod CTRL, F9, movetoworkspace, 19 # Move active window to and move to workspace 19
bind = $mainMod, n, movetoworkspacesilent, special # Move active window to the special workspace

bind = $mainMod, right, workspace, +1 # Move to the next workspace
bind = $mainMod, left, workspace, -1 # Move to the previous workspace


# bind = $mainMod CTRL, 1, exec, $HYPRSCRIPTS/moveTo.sh 1 # Move all windows to workspace 1
# bind = $mainMod CTRL, 2, exec, $HYPRSCRIPTS/moveTo.sh 2 # Move all windows to workspace 2
# bind = $mainMod CTRL, 3, exec, $HYPRSCRIPTS/moveTo.sh 3 # Move all windows to workspace 3
# bind = $mainMod CTRL, 4, exec, $HYPRSCRIPTS/moveTo.sh 4 # Move all windows to workspace 4
# bind = $mainMod CTRL, 5, exec, $HYPRSCRIPTS/moveTo.sh 5 # Move all windows to workspace 5
# bind = $mainMod CTRL, 6, exec, $HYPRSCRIPTS/moveTo.sh 6 # Move all windows to workspace 6
# bind = $mainMod CTRL, 7, exec, $HYPRSCRIPTS/moveTo.sh 7 # Move all windows to workspace 7
# bind = $mainMod CTRL, 8, exec, $HYPRSCRIPTS/moveTo.sh 8 # Move all windows to workspace 8
# bind = $mainMod CTRL, 9, exec, $HYPRSCRIPTS/moveTo.sh 9 # Move all windows to workspace 9
# bind = $mainMod CTRL, 0, exec, $HYPRSCRIPTS/moveTo.sh 10 # Move all windows to workspace 10

bind = $mainMod, mouse_down, workspace, e+1 # Open next workspace
bind = $mainMod, mouse_up, workspace, e-1 # Open previous workspace
bind = $mainMod CTRL, down, workspace, empty # Open the next empty workspace

# Passthrough SUPER KEY to Virtual Machine
# bind = $mainMod, P, submap, passthru # Passthrough SUPER key to virtual machine
# submap = passthru
# bind = SUPER, Escape, submap, reset # Get SUPER key back from virtual machine
# submap = reset

# Fn keys
bind = , XF86MonBrightnessUp, exec, brightnessctl -q s +10% # Increase brightness by 10%
bind = , XF86MonBrightnessDown, exec, brightnessctl -q s 10%- # Reduce brightness by 10%
bind = , XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +5% # Increase volume by 5%
bind = , XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -5% # Reduce volume by 5%
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle # Toggle mute
bind = , XF86AudioPlay, exec, playerctl play-pause # Audio play pause
bind = , XF86AudioPause, exec, playerctl pause # Audio pause
bind = , XF86AudioNext, exec, playerctl next # Audio next
bind = , XF86AudioPrev, exec, playerctl previous # Audio previous
bind = , XF86AudioMicMute, exec, pactl set-source-mute @DEFAULT_SOURCE@ toggle # Toggle microphone
bind = , XF86Calculator, exec, ~/.config/ml4w/settings/calculator.sh # Open calculator
bind = , XF86Lock, exec, hyprlock # Open screenlock
bind = $mainMod CTRL, L, exec, hyprlock # Hyprlock
# bind = , XF86Tools, exec, $(cat ~/.config/ml4w/settings/terminal.sh) --class dotfiles-floating -e ~/.config/ml4w/apps/ML4W_Dotfiles_Settings-x86_64.AppImage # Open ML4W Dotfiles Settings app
bind = SUPER, XF86Tools, exec, kitty --class dotfiles-floating -e ~/.config/ml4w/apps/ML4W_Dotfiles_Settings-x86_64.AppImage

bind = , code:238, exec, brightnessctl -d smc::kbd_backlight s +10
bind = , code:237, exec, brightnessctl -d smc::kbd_backlight s 10- 
